<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The empty game</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The early catch (net/telemetry.ts `EarlyCatch`): errors before the bundle is up are queued
         here, and the bundle's telemetry takes them over. The empty game sends none of its own. -->
    <script>
      (function () {
        var dh = { q: [], on: null };
        window.__dh = dh;
        var hear = function (e) { if (dh.on) dh.on(e); else dh.q.push(e); };
        addEventListener("error", function (e) {
          hear({ kind: "uncaught", msg: String(e.message || e), stack: e.error && e.error.stack, at: Date.now() });
        });
        addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          hear({ kind: "unhandled", msg: String((r && r.message) || r), stack: r && r.stack, at: Date.now() });
        });
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101014; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
